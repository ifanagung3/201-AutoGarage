name: UTS SBDT - 201 AutoGarage
on:
  push:
    branches: [main, 'uts-sbdt-*']
    paths: ['uts-sbdt/**', '.github/workflows/python-app.yml']
  pull_request:
    paths: ['uts-sbdt/**', '.github/workflows/python-app.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uts-sbdt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: uts-sbdt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: uts-sbdt/backend/requirements*.txt
      - name: Install test dependencies and browser
        run: |
          pip install -r backend/requirements-test.txt
          python -m playwright install --with-deps chromium
          echo '127.0.0.1 auth.lokal api.lokal' | sudo tee -a /etc/hosts
      - name: Generate isolated lab credentials
        run: python scripts/bootstrap.py
      - name: Unit tests with real RSA signatures and trained model
        run: |
          mkdir -p evidence
          set -o pipefail
          pytest tests -v --junitxml=evidence/unit-tests.xml | tee evidence/unit-tests.txt
      - name: Build and start Docker Compose
        run: |
          docker compose config --quiet
          docker compose up -d --build
          docker image inspect autogarage-uts:e2e --format '{{json .Id}}' > evidence/api-image-id.txt
          docker compose version > evidence/docker-version.txt
      - name: Compose end-to-end HTTP and SQL proof
        run: |
          set -o pipefail
          python scripts/e2e.py compose | tee evidence/compose-checks.txt
          python scripts/browser-proof.py compose
          docker compose logs --no-color > evidence/compose-service-logs.txt
          docker compose down
      - name: Create Kubernetes Kind cluster
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind create cluster --name autogarage --image kindest/node:v1.32.2 --config kubernetes/kind.yaml
          kind load docker-image autogarage-uts:e2e --name autogarage
          kubectl version -o json > evidence/kubernetes-version.json
          python scripts/deploy-k8s.py
      - name: Kubernetes end-to-end and pod persistence proof
        run: |
          set -o pipefail
          python scripts/e2e.py kubernetes | tee evidence/kubernetes-checks.txt
          python scripts/browser-proof.py kubernetes
          kubectl -n autogarage logs postgres-primary-0 > evidence/kubernetes-primary-logs.txt
          kubectl -n autogarage get events --sort-by=.lastTimestamp > evidence/kubernetes-events.txt
      - name: Capture diagnostics and provenance
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > evidence/run-url.txt
          date -u +%FT%TZ > evidence/captured-at.txt
          docker compose logs --no-color > evidence/compose-final-logs.txt 2>&1 || true
          kubectl -n autogarage get pods,sts,svc,pvc,ingress -o wide > evidence/kubernetes-final-resources.txt 2>&1 || true
          kubectl -n autogarage describe pods > evidence/kubernetes-pod-diagnostics.txt 2>&1 || true
          for label in postgres-primary postgres-replica backend keycloak ingress; do
            kubectl -n autogarage logs -l app=$label --all-containers --tail=200 > evidence/kubernetes-$label-final-logs.txt 2>&1 || true
          done
      - name: Upload original test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autogarage-uts-evidence
          path: uts-sbdt/evidence/
          retention-days: 30
