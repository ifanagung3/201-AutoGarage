name: autogarage-uts
services:
  postgres-primary:
    image: postgres:16.8
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: autogarage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run bootstrap}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run bootstrap}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?run bootstrap}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run bootstrap}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: [postgres, -c, wal_level=replica, -c, max_wal_senders=6, -c, wal_keep_size=256MB]
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./database/001_schema.sql:/opt/autogarage/001_schema.sql:ro
      - ./database/init-primary.sh:/docker-entrypoint-initdb.d/010_init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d autogarage"]
      interval: 5s
      timeout: 3s
      retries: 30
  postgres-replica:
    image: postgres:16.8
    environment:
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?run bootstrap}
      PGDATA: /var/lib/postgresql/data/pgdata
    entrypoint: [bash, /scripts/start-replica.sh]
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./database/start-replica.sh:/scripts/start-replica.sh:ro
    depends_on:
      postgres-primary: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d autogarage"]
      interval: 5s
      timeout: 3s
      retries: 40
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: [start-dev, --import-realm, --hostname=http://auth.lokal:8080, --proxy-headers=xforwarded]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-primary:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run bootstrap}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run bootstrap}
      KC_HEALTH_ENABLED: 'true'
      JAVA_OPTS_APPEND: '-Xms128m -Xmx384m'
    volumes:
      - ./keycloak/realm.generated.json:/opt/keycloak/data/import/autogarage.json:ro
    depends_on:
      postgres-primary: {condition: service_healthy}
  backend:
    image: ${API_IMAGE:-autogarage-uts:e2e}
    build: ./backend
    environment:
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run bootstrap}
      DB_WRITE_HOST: postgres-primary
      DB_READ_HOST: postgres-replica
      OIDC_ISSUER: http://auth.lokal:8080/realms/autogarage
      OIDC_JWKS_URL: http://keycloak:8080/realms/autogarage/protocol/openid-connect/certs
    depends_on:
      postgres-primary: {condition: service_healthy}
      postgres-replica: {condition: service_healthy}
  gateway:
    image: nginx:1.27.4-alpine
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend,keycloak]
volumes:
  primary_data:
  replica_data:
