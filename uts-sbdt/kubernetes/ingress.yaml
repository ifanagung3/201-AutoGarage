apiVersion: v1
kind: ServiceAccount
metadata: {name: ingress, namespace: autogarage}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: autogarage-ingress}
rules:
  - apiGroups: ['']
    resources: [services, endpoints, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: autogarage-ingress}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: autogarage-ingress}
subjects: [{kind: ServiceAccount, name: ingress, namespace: autogarage}]
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: {name: traefik}
spec: {controller: traefik.io/ingress-controller}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ingress, namespace: autogarage}
spec:
  replicas: 1
  selector: {matchLabels: {app: ingress}}
  template:
    metadata: {labels: {app: ingress}}
    spec:
      serviceAccountName: ingress
      containers:
        - name: traefik
          image: traefik:v3.3.6
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces=autogarage
            - --providers.kubernetesingress.ingressclass=traefik
            - --entrypoints.web.address=:8000
            - --accesslog=true
          ports: [{containerPort: 8000}]
          readinessProbe: {tcpSocket: {port: 8000}, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: ingress, namespace: autogarage}
spec:
  type: NodePort
  selector: {app: ingress}
  ports: [{port: 80, targetPort: 8000, nodePort: 30080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: autogarage, namespace: autogarage}
spec:
  ingressClassName: traefik
  rules:
    - host: auth.lokal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: keycloak, port: {number: 8080}}}
    - host: api.lokal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: backend, port: {number: 8000}}}
